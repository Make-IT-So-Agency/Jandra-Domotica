name: Productie uitrollen

# Zet het Vercel-project gelijk met infra/vercel-omgeving.json — zowel de
# instellingen van het project als de omgevingsvariabelen — en rolt daarna uit.
#
# Migraties zitten bewust in een aparte workflow. Bij een push naar main lopen
# de twee naast elkaar en staat niet vast wie eerst klaar is; wanneer de
# volgorde uitmaakt, splits je de wijziging over twee commits. Zie
# docs/UITROL.md.
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      alleen_tonen:
        description: "Alleen tonen wat er zou wijzigen, niets doen"
        type: boolean
        default: false

concurrency:
  group: uitrollen-productie
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  uitrollen:
    name: Instellen en uitrollen
    runs-on: ubuntu-latest
    environment: productie
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Controleer de instellingen van deze omgeving
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          ontbreekt=0
          [ -n "$VERCEL_TOKEN" ]      || { echo "Ontbreekt: secret VERCEL_TOKEN"; ontbreekt=1; }
          [ -n "$VERCEL_PROJECT_ID" ] || { echo "Ontbreekt: variable VERCEL_PROJECT_ID"; ontbreekt=1; }
          if [ "$ontbreekt" = "1" ]; then
            echo "::error::De GitHub-omgeving 'productie' is niet volledig ingesteld. Ga naar Settings → Environments → productie."
            exit 1
          fi
          echo "Alle instellingen aanwezig."

      - name: Vercel-project gelijkzetten
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          # De waarden zelf. Het script leest ze per naam uit de omgeving, dus
          # deze lijst hoort gelijk te lopen met infra/vercel-omgeving.json.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          TOEGELATEN_EMAILS: ${{ secrets.TOEGELATEN_EMAILS }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ "${{ inputs.alleen_tonen }}" = "true" ]; then
            node scripts/zet-vercel-omgeving.mjs --droogloop
          else
            node scripts/zet-vercel-omgeving.mjs
          fi

      - name: Uitrollen naar Vercel
        if: ${{ inputs.alleen_tonen != true }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        run: |
          npx -y vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx -y vercel@latest build --prod --token="$VERCEL_TOKEN"
          adres=$(npx -y vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Uitgerold naar $adres"
          {
            echo "### Uitgerold"
            echo ""
            echo "$adres"
          } >> "$GITHUB_STEP_SUMMARY"
